<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Acuario Marino · Final Boss</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&family=Pacifico&display=swap">
<meta name="theme-color" content="#bfe9f8">
<meta name="color-scheme" content="light">

<style>
/* Layout: app móvil (columna de 520 px como máximo, pensada para 412 px del Vivo X300 Pro) con barra inferior de cuatro pestañas; fondo de agua clara con corales en acuarela. */
:root {
  --bg: #eef8fc;
  --bg-2: #dff1f8;
  --surface: #ffffff;
  --surface-2: #f4fafd;
  --ink: #0c2b4b;
  --ink-2: #1d4670;
  --muted: #5f7891;
  --muted-2: #9ab0c2;
  --line: #e1edf4;
  --primary: #1871d6;
  --primary-2: #1aa3c9;
  --primary-ink: #ffffff;
  --teal: #13a7a0; --teal-s: #dcf5f3;
  --blue: #1f73d8; --blue-s: #e1edfc;
  --sky: #2a9bd8; --sky-s: #dff0fa;
  --purple: #8a4fd6; --purple-s: #efe5fc;
  --red: #e5484d; --red-s: #fde6e6;
  --orange: #f08a24; --orange-s: #fdeedd;
  --green: #22a95b; --green-s: #dcf5e6;
  --pink: #e05aa0; --pink-s: #fce4f1;
  --ok: #22a95b; --warn: #e88f1a; --crit: #e5484d;
  --kh: #23b3c4; --ca: #6cc04a; --trace: #9a63e0;
  --coral-pink: #f39ac7; --coral-purple: #b38be8; --coral-orange: #f7a86b; --weed: #7fd0c4;
  --bubble: #9fd3ea; --water: #cdeefa; --water-top: #a9def3; --sand: #f2deb3; --glass: #8fb8cf; --cap: #34495e;
  --shadow: 0 6px 18px rgb(19 74 120 / 0.08), 0 1px 2px rgb(19 74 120 / 0.06);
  --radius: 18px;
  --font: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061a2a; --bg-2: #0a2438; --surface: #0e2a40; --surface-2: #12324b; --ink: #e8f3fb; --ink-2: #bcd6ea; --muted: #8fabc2; --muted-2: #5d7a91; --line: #1b3b55;
    --primary: #4b9bf0; --primary-2: #39c2e0; --primary-ink: #04121e;
    --teal: #3cd0c7; --teal-s: #0f3a3c; --blue: #63a4f2; --blue-s: #143456; --sky: #5fc0ee; --sky-s: #12364b; --purple: #b58cf2; --purple-s: #2b2350; --red: #ff7a7e; --red-s: #43191e; --orange: #ffb05c; --orange-s: #42290f; --green: #4fd38a; --green-s: #113a28; --pink: #f58cc0; --pink-s: #44193a;
    --ok: #4fd38a; --warn: #ffb05c; --crit: #ff7a7e;
    --coral-pink: #a8517f; --coral-purple: #6e4fa0; --coral-orange: #a86a3e; --weed: #2f7a71; --bubble: #2c5d7a; --water: #12405a; --water-top: #1a5571; --sand: #6b5a3b; --glass: #4d7d98; --cap: #9fb6c8;
    --shadow: 0 6px 18px rgb(0 0 0 / 0.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061a2a; --bg-2: #0a2438; --surface: #0e2a40; --surface-2: #12324b; --ink: #e8f3fb; --ink-2: #bcd6ea; --muted: #8fabc2; --muted-2: #5d7a91; --line: #1b3b55;
  --primary: #4b9bf0; --primary-2: #39c2e0; --primary-ink: #04121e;
  --teal: #3cd0c7; --teal-s: #0f3a3c; --blue: #63a4f2; --blue-s: #143456; --sky: #5fc0ee; --sky-s: #12364b; --purple: #b58cf2; --purple-s: #2b2350; --red: #ff7a7e; --red-s: #43191e; --orange: #ffb05c; --orange-s: #42290f; --green: #4fd38a; --green-s: #113a28; --pink: #f58cc0; --pink-s: #44193a;
  --ok: #4fd38a; --warn: #ffb05c; --crit: #ff7a7e;
  --coral-pink: #a8517f; --coral-purple: #6e4fa0; --coral-orange: #a86a3e; --weed: #2f7a71; --bubble: #2c5d7a; --water: #12405a; --water-top: #1a5571; --sand: #6b5a3b; --glass: #4d7d98; --cap: #9fb6c8;
  --shadow: 0 6px 18px rgb(0 0 0 / 0.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: linear-gradient(180deg, var(--bg-2) 0%, var(--bg) 260px) fixed, var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-weight: 600; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg-2); }
h1, h2, h3 { margin: 0; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
.num, .big, b, .tile-val, .big-input, td.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.block { display: block; font-weight: 600; }
:focus-visible { outline: 3px solid var(--primary-2); outline-offset: 2px; }
.ic { flex: none; }

.main { max-width: 520px; margin: 0 auto; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(96px + env(safe-area-inset-bottom, 0px)); position: relative; z-index: 1; }
.screen { display: flex; flex-direction: column; gap: 14px; }
.art-footer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 90px; z-index: 0; opacity: 0.55; pointer-events: none; }

/* Cabeceras */
.scr-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding-top: 6px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: linear-gradient(var(--bg-2), var(--bg-2) 70%, transparent); padding-bottom: 6px; margin-inline: -14px; padding-inline: 14px; }
.scr-title { text-align: center; min-width: 0; }
.scr-title h1 { font-size: 20px; }
.scr-title p { font-size: 13px; color: var(--muted); }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow); color: var(--ink-2); cursor: pointer; }
.icon-btn.ghost { background: transparent; box-shadow: none; }
.icon-btn.solid { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: var(--primary-ink); }
.badge { position: absolute; top: 2px; right: 2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.home-hero { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: end; min-height: 128px; padding: 18px 2px 4px; }
.hero-text { position: relative; z-index: 1; }
.brand-mini { font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--primary); }
.home-hero h1 { font-size: 30px; font-weight: 900; color: var(--ink); }
.home-hero p:not(.brand-mini) { color: var(--ink-2); font-size: 14px; }
.art-reef { width: 170px; height: auto; max-width: 46vw; }
.home-hero .bell { position: absolute; top: 12px; right: 0; }

/* Estado */
.status-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 0; border-radius: var(--radius); padding: 16px; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; }
.status-card.ok { background: linear-gradient(120deg, var(--green-s), var(--surface) 70%); }
.status-card.warn { background: linear-gradient(120deg, var(--orange-s), var(--surface) 70%); }
.status-card.crit { background: linear-gradient(120deg, var(--red-s), var(--surface) 70%); }
.status-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.status-text strong { font-size: 22px; font-weight: 900; }
.status-card.ok strong { color: var(--green); }
.status-card.warn strong { color: var(--warn); }
.status-card.crit strong { color: var(--crit); }
.status-text span { color: var(--muted); font-size: 14px; }
.chev { color: var(--muted-2); }
.st-badge { width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; color: #fff; flex: none; }
.st-badge.ok { background: var(--ok); }
.st-badge.warn { background: var(--warn); }
.st-badge.crit { background: var(--crit); }
.st-badge.mute { background: var(--muted-2); }

/* Mosaico de parámetros */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { border: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 10px 10px 9px; display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; min-width: 0; }
.tile-top { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13px; color: var(--ink-2); }
.tile-val { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.tile-val b { font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
.tile-range { font-size: 11.5px; color: var(--muted); }
.p-ic { width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; flex: none; }
.p-ic b { font-size: calc(var(--s) * 0.38); font-weight: 900; }
.p-ic.teal, .chip-ic.teal { background: var(--teal-s); color: var(--teal); }
.p-ic.blue, .chip-ic.blue { background: var(--blue-s); color: var(--blue); }
.p-ic.sky, .chip-ic.sky { background: var(--sky-s); color: var(--sky); }
.p-ic.purple, .chip-ic.purple { background: var(--purple-s); color: var(--purple); }
.p-ic.red, .chip-ic.red { background: var(--red-s); color: var(--red); }
.p-ic.orange, .chip-ic.orange { background: var(--orange-s); color: var(--orange); }
.chip-ic.green { background: var(--green-s); color: var(--green); }
.chip-ic.pink { background: var(--pink-s); color: var(--pink); }
.chip-ic { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; }

/* Paneles y filas */
.panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 0; width: 100%; text-align: left; }
.panel-head.link { cursor: pointer; }
.panel-head h2 { font-size: 16px; flex: 1; }
.count-pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--red-s); color: var(--red); }
.count-pill.ok { background: var(--green-s); color: var(--green); }
.count-dot { min-width: 22px; height: 22px; border-radius: 11px; background: var(--red); color: #fff; font-size: 12px; font-weight: 800; display: grid; place-items: center; padding: 0 6px; }
.row-link { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 2px; border-top: 1px solid var(--line); cursor: default; }
button.row-link { cursor: pointer; }
.panel .panel-head + .row-link { border-top: 0; }
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-text strong { font-weight: 800; font-size: 14.5px; }
.row-text span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.card-link { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; border-top: 0; }
.art-mini { width: 74px; height: auto; }
.empty { color: var(--muted); font-size: 14px; padding: 4px 2px; }
.foot-note { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 0; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-card { border: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; min-width: 0; }
.mini-title { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; color: var(--purple); }
.mini-card:nth-child(2) .mini-title { color: var(--blue); }
.mini-body { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.mini-body > span { display: flex; flex-direction: column; }
.mini-body b { color: var(--ink); font-size: 14px; }
.mini-body.col { flex-direction: column; align-items: flex-start; gap: 2px; }
.art-fish-sm { width: 62px; height: auto; flex: none; }

/* Segmentos y chips */
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: var(--shadow); gap: 4px; }
.segmented button { border: 0; background: none; border-radius: 999px; padding: 9px 6px; font-weight: 800; font-size: 13.5px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: linear-gradient(135deg, var(--primary-2), var(--primary)); color: var(--primary-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 7px 14px; font-weight: 800; font-size: 14px; cursor: pointer; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.chips.small .chip { padding: 4px 11px; font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Medición rápida */
.measure-card { border: 2px solid var(--primary-2); }
.mc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mc-name { display: flex; flex-direction: column; flex: 1; min-width: 90px; }
.mc-name strong { font-size: 18px; }
.mc-name span { color: var(--muted); font-size: 13px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.step { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.big-input { width: 108px; text-align: center; font-size: 30px; font-weight: 900; color: var(--ink); border: 2px solid var(--line); border-radius: 14px; padding: 4px 6px; background: var(--surface); font-family: var(--font); }
.mc-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.meta-field { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.meta-field input { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface-2); color: var(--ink); font: 600 13px var(--font); min-width: 0; }
.meta-field.lot input { width: 70px; }
.ver-chip { display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 5px 10px; font-weight: 800; font-size: 12.5px; cursor: pointer; }
.ver-chip.ok { background: var(--green-s); color: var(--green); }
.ver-chip.warn { background: var(--orange-s); color: var(--orange); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.mc-method, .hint { font-size: 12.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini-param { border: 0; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 10px; display: flex; gap: 8px; align-items: flex-start; text-align: left; cursor: pointer; min-width: 0; }
.mp-text { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.mp-name { font-size: 12.5px; color: var(--muted); }
.mp-text b { font-size: 20px; font-weight: 900; }
.mp-range { font-size: 11.5px; color: var(--muted); }
.mp-side { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--muted-2); }
.full-form { display: flex; flex-direction: column; gap: 8px; }
.ff-row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 96px; gap: 8px; align-items: center; }
.ff-main { display: flex; flex-direction: column; min-width: 0; }
.ff-main span { font-size: 12px; color: var(--muted); }
.ff-input, .ff-lot { border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--surface-2); color: var(--ink); font: 800 16px var(--font); width: 100%; min-width: 0; text-align: center; }
.ff-lot { font-size: 13px; font-weight: 600; }

/* Dosificación */
.device { background: linear-gradient(135deg, var(--surface), var(--sky-s)); }
.device-head { display: flex; align-items: center; gap: 10px; }
.device-head > div { flex: 1; display: flex; flex-direction: column; }
.device-head strong { font-size: 18px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted-2); display: inline-block; }
.dot.on { background: var(--ok); }
.art-doser { width: 110px; height: auto; }
.part { display: grid; grid-template-columns: 34px minmax(0, 1fr) 96px; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.panel-head + .part { border-top: 0; }
.art-bottle { width: 34px; height: auto; }
.part-main { display: flex; flex-direction: column; min-width: 0; }
.part-main strong { font-size: 16px; }
.part-dose { font-weight: 900; font-size: 15px; color: var(--ink-2); }
.part-sched, .part-head { font-size: 12px; color: var(--muted); }
.part-side { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); align-items: stretch; text-align: right; }
.part-side b { color: var(--ink); font-size: 14px; }
.bar { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 4px; background: var(--teal); }
.bar.green > span { background: var(--green); }
.bar.purple > span { background: var(--purple); }
.bar.red > span { background: var(--red); }
.toggle-state { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: var(--muted); }
.toggle-state .knob { width: 38px; height: 22px; border-radius: 11px; background: var(--muted-2); position: relative; }
.toggle-state .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.toggle-state.on { color: var(--teal); }
.toggle-state.on .knob { background: var(--teal); }
.toggle-state.on .knob::after { left: 19px; }
.warn-line { display: flex; gap: 6px; align-items: flex-start; color: var(--crit); font-size: 13px; }
.deposit-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.deposit { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
.deposit b { color: var(--ink); }
.art-dep { width: 30px; height: auto; }
.day-sum { font-size: 14px; color: var(--muted); }
.day-sum b { font-size: 22px; color: var(--ink); }

/* Gestión */
.search { border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; background: var(--surface); color: var(--ink); font: 700 15px var(--font); width: 100%; }
.hub { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hub-tile { border: 0; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 8px; text-align: left; cursor: pointer; min-height: 116px; min-width: 0; }
.hub-head { display: flex; align-items: center; gap: 8px; }
.hub-title { font-weight: 800; font-size: 13.5px; flex: 1; line-height: 1.2; overflow-wrap: anywhere; }
.hub-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex: none; }
.hub-body { display: flex; align-items: flex-end; gap: 8px; flex: 1; }
.hub-lines { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); min-width: 0; }
.hub-lines b { color: var(--ink); font-size: 14px; }
.art-tile { width: 64px; height: auto; flex: none; }
.art-tile-b { width: 26px; height: auto; flex: none; }
.art-tile-d { width: 58px; height: auto; flex: none; }
.art-tile-f { width: 56px; height: auto; flex: none; }
.profile-top { display: flex; align-items: center; gap: 12px; }
.profile-top > div { display: flex; flex-direction: column; }
.profile-top strong { font-size: 17px; }
.profile-top span { color: var(--muted); font-size: 13px; }
.art-profile { width: 110px; height: auto; flex: none; }
.ok-line { display: flex; gap: 6px; align-items: center; color: var(--green); font-size: 14px; }
.prod-list { display: flex; flex-direction: column; gap: 8px; }
.prod { display: flex; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 8px 10px; }
.prod > div { display: flex; flex-direction: column; min-width: 0; }
.art-prod { width: 28px; height: auto; flex: none; }
.equip { display: flex; flex-direction: column; gap: 10px; }

<style id="periodo-base">
/* Periodo base sin aditar (0.6.0): cinco casillas de día y el resultado. */
.bl-days { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.bl-day { display: grid; place-items: center; height: 38px; border-radius: 14px; border: 1.5px dashed #b9dbf1; background: rgb(255 255 255 / .7); color: var(--muted); font-family: var(--display); }
.bl-day b { font-weight: 600; font-size: 15px; }
.bl-day.on { border: 1.5px solid #8fd0ea; color: #fff; background: linear-gradient(180deg, #6fd6f7, #1fa6de); box-shadow: inset 0 1px 0 rgb(255 255 255 / .6), 0 6px 12px -6px rgb(17 120 190 / .55); text-shadow: 0 1px 0 rgb(8 70 120 / .5); }
.bl-day.on.gap { background: linear-gradient(180deg, #ffd38a, #f0a63a); border-color: #f2c47a; }
.bl-result { font-size: 15px; color: var(--ink); }
.bl-result b { font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--brand); }
</style>
